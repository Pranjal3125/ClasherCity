name: Build ClasherCity
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -U clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ClasherCity-1.1.0
          path: target/ClasherCity-1.0.0.jar
