name: ClasherCity
version: '${project.version}'
main: network.clasher.clashercity.ClasherCityPlugin
api-version: '26.2'
authors: [Clasher Network]
description: Automated city plots and building tournament system for Clasher Network.
website: https://github.com/Pranjal3125/ClasherCity
load: POSTWORLD
depend: [WorldGuard, Vault]
softdepend: [FastAsyncWorldEdit, SmartSpawner, Essentials]

commands:
  clcity:
    description: ClasherCity administration and judge scoring controls
    usage: /clcity help
  city:
    description: Open the ClasherCity main menu or visit the city spawn
    usage: /city [visit]
  citymap:
    description: Open the paginated ClasherCity map menu
    usage: /citymap
  plots:
    description: Browse ClasherCity plots
    usage: /plots
  plot:
    description: Claim, enter, visit, inspect, or release a city plot
    usage: /plot <claim|enter|home|info|abandon> [plot-id]
  buildvote:
    description: Vote for a ClasherCity building entry
    usage: /buildvote
  buildtop:
    description: View ClasherCity tournament standings
    usage: /buildtop

permissions:
  clashercity.admin:
    description: Full ClasherCity administration
    default: op
  clashercity.bypass:
    description: Bypass ClasherCity event-level plot and phase restrictions
    default: op
  clashercity.judge:
    description: Allows judge score submission when registered for the tournament
    default: false
